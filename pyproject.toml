[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karen-ai"
version = "0.1.0"
description = "Privacy-first offline Windows AI companion"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
voice = [
    "faster-whisper>=1.0",
    "numpy>=1.26",
    "openwakeword>=0.6",
    "piper-tts>=1.2",
    "sounddevice>=0.4",
    "speechbrain>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["karen*"]
