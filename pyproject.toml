[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karen-ai"
version = "0.1.0"
description = "Privacy-first, voice-first local Windows AI assistant"
requires-python = ">=3.12"
dependencies = ["psutil>=5.9", "comtypes>=1.4; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
voice = [
    "faster-whisper>=1.0",
    "numpy>=1.26",
    "sounddevice>=0.4",
]
wakeword = ["openwakeword>=0.6", "numpy>=1.26", "sounddevice>=0.4"]
web = ["ddgs>=9.0"]
piper = ["piper-tts>=1.2"]
browser = ["playwright>=1.45"]

[project.scripts]
karen = "karen.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["karen*"]
